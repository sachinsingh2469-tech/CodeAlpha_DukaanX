<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details - DukaanX</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Minimal Header -->
  <header class="header-bar">
    <div class="header-left">
      <a href="index.html" class="brand-wrapper">
        <div class="brand-icon-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="black">
            <polygon points="12 2 22 22 2 22"></polygon>
          </svg>
        </div>
        <span class="brand-logo-text">DUKAANX STORE</span>
      </a>
    </div>

    <div class="header-right">
      <a href="index.html" style="text-decoration:none; font-size:13px; color:#6e6e73; margin-right:12px;">← Back to collection</a>
      <button class="cart-toggle-btn" id="openCartBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
        <span class="cart-toggle-badge" id="cartBadge">0</span>
      </button>
    </div>
  </header>

  <!-- Main Product Detail View -->
  <main class="product-detail-layout">
    <div class="product-gallery-pane">
      <div class="product-main-showcase">
        <img id="productImage" src="images/tshirt2.jpg" alt="Product Showcase" />
      </div>
    </div>

    <div class="product-info-pane">
      <h1 class="product-page-title" id="productTitle">Loading...</h1>
      <div class="product-page-price" id="productPrice">₹0 INR</div>

      <p class="product-description-copy" id="productDesc"></p>

      <div class="options-container">
        <div class="option-label">COLOR</div>
        <div class="pill-options-group" id="colorOptions"></div>

        <div class="option-label">SIZE</div>
        <div class="pill-options-group" id="sizeOptions"></div>
      </div>

      <button type="button" class="btn-primary-blue add-to-cart-large" id="addToCartBtn">
        + Add To Cart
      </button>
    </div>
  </main>

  <!-- Related Products Section (Amazon / Apple Style) -->
  <section class="related-products-section">
    <div class="related-header">
      <h2 class="related-title">Similar Items In This Category</h2>
      <span class="related-subtitle">Explore more matching gear</span>
    </div>
    <div class="related-products-carousel" id="relatedProductsGrid">
      <!-- Injected dynamically via product.js -->
    </div>
  </section>

  <!-- Side Cart Drawer -->
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="cart-drawer-sheet" id="cartDrawer">
    <div class="drawer-header">
      <h3 style="font-size: 16px;">My Cart</h3>
      <button id="closeDrawerBtn" style="background:none; border:none; font-size:18px; cursor:pointer;">✕</button>
    </div>
    <div class="drawer-content" id="drawerItems"></div>
    <div class="drawer-footer">
      <div class="drawer-summary-line">
        <span>Total</span>
        <strong id="drawerTotalAmount">₹0 INR</strong>
      </div>
      <a href="checkout.html" class="btn-primary-blue">Proceed to Checkout</a>
    </div>
  </aside>

  <script src="js/product.js"></script>
</body>
</html>
