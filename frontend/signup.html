<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account - DukaanX</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .auth-wrapper {
      min-height: 85vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border: 1px solid #e5e5e7;
      border-radius: 18px;
      padding: 36px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.04);
    }
    .auth-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #1d1d1f;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.8px;
      margin-bottom: 24px;
    }
    .auth-title {
      font-size: 26px;
      font-weight: 700;
      color: #1d1d1f;
      margin-bottom: 8px;
    }
    .auth-subtitle {
      font-size: 14px;
      color: #86868b;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 12px;
      font-weight: 600;
      color: #1d1d1f;
      text-transform: uppercase;
    }
    .form-group input {
      padding: 12px 14px;
      border: 1px solid #d2d2d7;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      border-color: #0071e3;
    }
    .auth-btn {
      width: 100%;
      background: #0071e3;
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    .auth-btn:hover {
      background: #0077ed;
    }
    .auth-error {
      color: #e11d48;
      background: #ffe4e6;
      border: 1px solid #fecdd3;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .auth-switch {
      text-align: center;
      font-size: 13px;
      color: #6e6e73;
      margin-top: 20px;
    }
    .auth-switch a {
      color: #0071e3;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <a href="index.html" class="auth-brand">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="black">
          <polygon points="12 2 22 22 2 22"></polygon>
        </svg>
        <span>DUKAANX STORE</span>
      </a>

      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Join DukaanX to save addresses and track orders</p>
      
      <div id="authError" class="auth-error"></div>

      <form id="signupForm">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" required placeholder="Sachin" />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="name@example.com" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="At least 6 characters" minlength="6" />
        </div>

        <button type="submit" class="auth-btn" id="submitBtn">Sign Up</button>
      </form>

      <div class="auth-switch">
        Already have an account? <a href="login.html">Sign In</a>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    const form = document.getElementById('signupForm');
    const errBox = document.getElementById('authError');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating Account...';

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        await auth.register(name, email, password);
        window.location.href = 'index.html';
      } catch (err) {
        errBox.textContent = err.message;
        errBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign Up';
      }
    });
  </script>
</body>
</html>
